name: ${GLOBAL_NAME}

services:
  postgres:
    container_name: ${POSTGRES_CONTAINER_NAME}
    image: ${POSTGRES_IMAGE_NAME}:${POSTGRES_IMAGE_VERSION}
    restart: ${RESTART_POLICY}
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TIMEZONE}
    ports:
      - ${POSTGRES_PORT}:5432
    volumes:
      - default:/var/lib/postgresql/data
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DATABASE}"]
      interval: ${HEALTHCHECK_INTERVAL}
      timeout: ${HEALTHCHECK_TIMEOUT}
      retries: ${HEALTHCHECK_RETRIES}

  passbolt:
    container_name: ${PASSBOLT_CONTAINER_NAME}
    image: ${PASSBOLT_IMAGE_NAME}:${PASSBOLT_IMAGE_VERSION}
    restart: ${RESTART_POLICY}
    environment:
      APP_FULL_BASE_URL: ${PASSBOLT_APP_URL}
      DATASOURCES_DEFAULT_HOST: "postgres"
      DATASOURCES_DEFAULT_PORT: "5432"
      DATASOURCES_DEFAULT_USERNAME: ${POSTGRES_USER}
      DATASOURCES_DEFAULT_PASSWORD: ${POSTGRES_PASSWORD}
      DATASOURCES_DEFAULT_DATABASE: ${POSTGRES_DATABASE}
      DATASOURCES_DEFAULT_DRIVER: "Cake\Database\Driver\Postgres"
      TZ: ${TIMEZONE}
    ports:
      - ${PASSBOLT_HTTP_PORT}:80
      - ${PASSBOLT_HTTPS_PORT}:443
    volumes:
      - gpg_volume:/etc/passbolt/gpg
      - jwt_volume:/etc/passbolt/jwt
    networks:
      - default
    depends_on:
      - postgres
    command: ["/usr/bin/wait-for.sh", "-t", "0", "postgres:5432", "--", "/docker-entrypoint.sh"]
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost/healthcheck/status || exit 1"]
      interval: ${HEALTHCHECK_INTERVAL}
      timeout: ${HEALTHCHECK_TIMEOUT}
      retries: ${HEALTHCHECK_RETRIES}

networks:
  default:
    name: ${PASSBOLT_CONTAINER_NAME}_network
    driver: bridge

volumes:
  default:
    name: ${PASSBOLT_CONTAINER_NAME}_data
    driver: local
  gpg_volume:
    name: ${PASSBOLT_CONTAINER_NAME}_gpg
    driver: local
  jwt_volume:
    name: ${PASSBOLT_CONTAINER_NAME}_jwt
    driver: local