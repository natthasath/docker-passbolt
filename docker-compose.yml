services:
  mariadb:
    container_name: ${MARIADB_CONTAINER_NAME}
    image: ${MARIADB_IMAGE_NAME}:${MARIADB_IMAGE_VERSION}
    restart: ${RESTART_POLICY}
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "true"
      MYSQL_DATABASE: ${MARIADB_DATABASE}
      MYSQL_USER: ${MARIADB_USER}
      MYSQL_PASSWORD: ${MARIADB_PASSWORD}
      TZ: ${TIMEZONE}
    ports:
      - ${MARIADB_PORT}:3306
    volumes:
      - default:/var/lib/mysql
    networks:
      - default
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: ${HEALTHCHECK_INTERVAL}
      timeout: ${HEALTHCHECK_TIMEOUT}
      retries: ${HEALTHCHECK_RETRIES}

  passbolt:
    container_name: ${PASSBOLT_CONTAINER_NAME}
    image: ${PASSBOLT_IMAGE_NAME}:${PASSBOLT_IMAGE_VERSION}
    restart: ${RESTART_POLICY}
    environment:
      APP_FULL_BASE_URL: ${PASSBOLT_APP_URL}
      DATASOURCES_DEFAULT_HOST: "mariadb"
      DATASOURCES_DEFAULT_USERNAME: ${MARIADB_USER}
      DATASOURCES_DEFAULT_PASSWORD: ${MARIADB_PASSWORD}
      DATASOURCES_DEFAULT_DATABASE: ${MARIADB_DATABASE}
      TZ: ${TIMEZONE}
    ports:
      - ${PASSBOLT_HTTP_PORT}:80
      - ${PASSBOLT_HTTPS_PORT}:443
    volumes:
      - gpg_volume:/etc/passbolt/gpg
      - jwt_volume:/etc/passbolt/jwt
    networks:
      - default
    depends_on:
      - mariadb
    command: ["/usr/bin/wait-for.sh", "-t", "0", "mariadb:3306", "--", "/docker-entrypoint.sh"]
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost/healthcheck/status || exit 1"]
      interval: ${HEALTHCHECK_INTERVAL}
      timeout: ${HEALTHCHECK_TIMEOUT}
      retries: ${HEALTHCHECK_RETRIES}

networks:
  default:
    name: ${PASSBOLT_CONTAINER_NAME}_network
    driver: bridge

volumes:
  default:
    name: ${PASSBOLT_CONTAINER_NAME}_data
    driver: local
  gpg_volume:
    name: ${PASSBOLT_CONTAINER_NAME}_gpg
    driver: local
  jwt_volume:
    name: ${PASSBOLT_CONTAINER_NAME}_jwt
    driver: local